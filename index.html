<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b18" />
    <title>Burn Bright 3D</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <!--
      The page is a stack of layers inside #phone:
        1. <canvas id="world">  — the Three.js 3D scene (drawn by src/world/)
        2. #hud, #judgement, #countIn — score and feedback text (src/ui/hud.js)
        3. #pads                — the four touch pads at the bottom
        4. #menu / #pauseScreen / #results — full-screen menus
    -->
    <main id="phone">
      <canvas id="world" aria-hidden="true"></canvas>

      <header id="hud" hidden>
        <div class="hud-left">
          <div class="hud-song">♪ <span id="hudTitle"></span></div>
          <div class="life"><span>ENERGY</span><div class="life-bar"><div id="lifeFill"></div></div></div>
          <div class="section"><span id="sectionName">OPENING</span><span id="clock">0:00</span></div>
          <div class="progress"><div id="progressFill"></div></div>
        </div>
        <div class="hud-right">
          <div class="score-label">SCORE</div>
          <div id="score">0</div>
          <div class="combo"><span id="combo">0</span>× COMBO</div>
        </div>
        <button id="pauseBtn" class="icon-btn" aria-label="Pause">❚❚</button>
      </header>

      <div id="countIn" aria-live="polite"></div>
      <div id="judgement"></div>
      <div id="banner"></div>

      <div id="pads" role="group" aria-label="Instrument pads"></div>

      <section id="menu" class="overlay">
        <div class="panel">
          <div class="chip" id="buildLabel"></div>
          <h1 class="logo"><span>BURN</span><span>BRIGHT</span></h1>
          <p class="tagline">THE PIXEL RIOT · LIVE IN 3D</p>
          <div class="song-card">
            <div class="song-row"><strong id="menuSongTitle"></strong><span id="menuBpm"></span></div>
            <p>Tap the four pads as the notes hit the line. Hold for long notes. Keys: D F J K.</p>
          </div>
          <div class="diffs" role="radiogroup" aria-label="Difficulty">
            <button data-diff="casual">CASUAL</button>
            <button data-diff="standard">STANDARD</button>
            <button data-diff="expert">EXPERT</button>
          </div>
          <label class="offset">
            <span>TAP OFFSET <b id="offsetValue">0 ms</b></span>
            <input id="offset" type="range" min="-120" max="120" step="10" value="0" />
          </label>
          <button id="startBtn" class="primary">▶ START THE SHOW</button>
          <p id="status" class="status" hidden></p>
          <p class="fine">Headphones recommended</p>
        </div>
      </section>

      <section id="pauseScreen" class="overlay" hidden>
        <div class="panel">
          <h2>PAUSED</h2>
          <button id="resumeBtn" class="primary">▶ RESUME</button>
          <button id="restartBtn">↻ RESTART SONG</button>
          <button id="quitBtn">☰ MAIN MENU</button>
        </div>
      </section>

      <section id="results" class="overlay" hidden>
        <div class="panel">
          <h2 id="headline">HEADLINER!</h2>
          <div id="finalScore" class="big-number">0</div>
          <dl class="stats">
            <dt>Perfect</dt><dd id="rPerfect">0</dd>
            <dt>Great</dt><dd id="rGreat">0</dd>
            <dt>Good</dt><dd id="rGood">0</dd>
            <dt>Miss</dt><dd id="rMiss">0</dd>
            <dt>Wrong taps</dt><dd id="rWrong">0</dd>
            <dt>Max combo</dt><dd id="rCombo">0</dd>
            <dt>Weighted accuracy</dt><dd id="rAccuracy">0%</dd>
          </dl>
          <button id="againBtn" class="primary">↻ PLAY AGAIN</button>
          <button id="menuBtn">☰ MAIN MENU</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
